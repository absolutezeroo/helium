<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Helium</title>
</head>
<body>

<div id="draggable-windows-container"></div>

<script type="module">
    import {Helium, Logger} from './src/index.ts';

    const log = Logger.getLogger('Helium');

    // Get SSO ticket from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const ssoTicket = urlParams.get('ssoTicket');

    if (!ssoTicket) {
        log.warn('No ssoTicket in URL. Use ?ssoTicket=YOUR_TICKET');
    }

    // Initialize Helium
    await Helium.bootstrap({
        background: '#0a0a0f',
        connection: {
            host: 'localhost',
            ports: [30001],
            ssoTicket: ssoTicket || undefined,
            autoConnect: true,
        },
        configurationUrl: 'http://habbo-swf.local/gamedata/external_renderer_variables/1'
    });
</script>
</body>
</html>
