<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helium</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; }
    #helium-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; }
  </style>
</head>
<body>
  <script type="module">
    import { Helium, Logger } from './src/index.ts';

    const log = Logger.getLogger('Helium');

    // Get SSO ticket from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const ssoTicket = urlParams.get('ssoTicket');

    if (!ssoTicket) {
      log.warn('No ssoTicket in URL. Use ?ssoTicket=YOUR_TICKET');
    }

    // Initialize Helium
    await Helium.bootstrap({
      background: '#1a1a2e',
      // Connection config
      connection: {
         host: 'localhost',
         ports: [2096],
         ssoTicket: ssoTicket || undefined,
         autoConnect: true,
      },
    });
  </script>
</body>
</html>
