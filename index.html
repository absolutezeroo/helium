<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Helium</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<script type="module">
    import {Helium, Logger} from './src/index.ts';

    const log = Logger.getLogger('Helium');

    // Get SSO ticket from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const ssoTicket = urlParams.get('ssoTicket');

    if (!ssoTicket) {
        log.warn('No ssoTicket in URL. Use ?ssoTicket=YOUR_TICKET');
    }

    // Initialize Helium
    await Helium.bootstrap({
        background: '#0a0a0f',
        connection: {
            host: 'localhost',
            ports: [2096],
            ssoTicket: ssoTicket || undefined,
            autoConnect: true,
        },
        configurationUrl: 'http://habbo-swf.local/gamedata/external_variables/1',
        'environment.id': 'development',
        'gamedata.hashes.url': 'http://habbo-swf.local/gamedata/hashes.json',
        "asset.url": "http://habbo-swf.local",
        "avatar.asset.url": "${asset.url}/bundled/figure/%libname%.nitro",
        "avatar.asset.effect.url": "${asset.url}/bundled/effect/%libname%.nitro",
        "furni.asset.url": "${asset.url}/bundled/furniture/%libname%.nitro",
        "furni.asset.icon.url": "${hof.furni.url}/icons/%libname%%param%_icon.png",
        "pet.asset.url": "${asset.url}/bundled/pet/%libname%.nitro",
        "generic.asset.url": "${asset.url}/bundled/generic/%libname%.nitro",
        "badge.asset.url": "${image.library.url}album1584/%badgename%.gif",
    });
</script>
</body>
</html>
